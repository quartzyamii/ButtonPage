<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beyond The Flow - Welcome</title>

    <!-- Google Fonts - Encode Sans Semi Expanded -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Encode+Sans+Semi+Expanded:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* Global */
      * {
        font-family: "Encode Sans Semi Expanded", sans-serif;
      }

      /* Layout - 동일한 스타일 */
      .tablet-optimized {
        min-height: 100vh;
        width: 100vw;
        max-width: 1200px;
        aspect-ratio: 3 / 5;
      }

      .bg-main {
        background-image: url("./image/Background2.png");
        background-size: cover;
        background-position: 45% center;
        background-repeat: no-repeat;
      }

      .portrait-layout {
        padding-top: 10vh;
        padding-bottom: 15vh;
      }

      /* Typography - index.html과 동일한 위치 */
      .hi-furon {
        font-size: 18pt;
        font-weight: 100;
        position: absolute;
        top: 15vh;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        text-align: center;
      }

      .furon-flow {
        font-size: 43pt;
        font-weight: 500;
        position: absolute;
        top: 22vh;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        text-align: center;
        line-height: 1.1;
      }

      .button-text {
        font-size: 28pt;
        font-weight: 200;
      }

      /* Buttons - 동일한 유리 질감 */
      .button {
        width: 300px;
        height: 70px;
        
        backdrop-filter: blur(5px) brightness(1.05);
        -webkit-backdrop-filter: blur(5px) brightness(1.05);
        
        box-shadow: 
          0 8px 32px rgba(0, 0, 0, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.4),
          inset 0 -1px 0 rgba(255, 255, 255, 0.1);
      }

      .button:hover {
        backdrop-filter: blur(20px) saturate(130%) brightness(1.1) hue-rotate(5deg);
        -webkit-backdrop-filter: blur(20px) saturate(130%) brightness(1.1) hue-rotate(5deg);

        box-shadow:
          0 12px 40px rgba(0, 0, 0, 0.15),
          inset 0 2px 0 rgba(255, 255, 255, 0.5),
          inset 0 -2px 0 rgba(255, 255, 255, 0.2);
      }

      /* 1200×2000 반응형 */
      @media (min-width: 1000px) {
        .button {
          width: 600px;
          height: 140px;
        }

        .hi-furon {
          font-size: 36pt;
        }

        .furon-flow {
          font-size: 86pt;
        }

        .button-text {
          font-size: 48pt;
        }

        .button-container {
          gap: 3rem;
        }
      }

      /* 버튼 공통 스타일 - 성능 최적화 */
      .btn-common {
        background-color: rgba(255, 255, 255, 0.1);
        color: white;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        
        /* 성능 최적화 */
        transform: translateZ(0); /* GPU 가속 활성화 */
        will-change: transform, background-color; /* 브라우저 최적화 힌트 */
        transition: all 0.2s ease-out; /* 더 빠른 트랜지션 */
        
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn-common:hover {
        background-color: rgba(255, 255, 255, 0.15);
        transform: translateZ(0) scale(1.03);
      }

      .btn-common:active {
        transform: translateZ(0) scale(0.98);
      }
    </style>
  </head>

  <body class="overflow-hidden">
    <div class="tablet-optimized bg-main portrait-layout mx-auto" style="position: relative;">
      
      <!-- index.html과 동일한 위치의 헤더 텍스트 -->
      <div class="text-white hi-furon">Welcome to this moment</div>

      <!-- index.html과 동일한 위치의 메인 타이틀 -->
      <div class="text-white furon-flow">
        Beyond The Flow
      </div>

      <!-- 2개 버튼 - 고정 위치 -->
      <div class="flex flex-col space-y-12 button-container">
        
        <button class="button button-text btn-common">
          Replay
        </button>

        <button class="button button-text btn-common" onclick="goToProcess()">
          View Flow
        </button>
      </div>
    </div>

    <script>


      // 과정 살펴보기 버튼 - 최적화된 페이지 전환
      function goToProcess() {
        console.log("🔍 과정 살펴보기 클릭");
        
        const button = event.target;
        button.style.pointerEvents = 'none'; // 중복 클릭 방지
        
        // 빠른 페이지 전환
        setTimeout(() => {
          window.location.href = "index.html";
        }, 500); // 400ms → 200ms로 단축
      }


    </script>
  </body>
</html>
