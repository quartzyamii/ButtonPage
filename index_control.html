<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Furon Flow</title>

     <!-- 파비콘 404 에러 방지 -->
    <link rel="icon" href="data:," />

    <!-- Google Fonts - Encode Sans Semi Expanded -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Encode+Sans+Semi+Expanded:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- LG Display Javascript Module -->
    <!-- 아래 두개 스크립트 태그 삽입 -->
    <script src="../js/mqttws31.js"></script>
    <script src="../js/TTMqttContainer_v1.0.0.js"></script>

    <script>
            // 프로젝트 코드 설정 (팀별로 고유 코드를 사용해야합니다. Ex: "teamA", "teamB", etc.)
            const projectCode = "sample";
            
            // MQTT 연결
            ttContainer.mqttConnect(projectCode, function() {
                console.log("MQTT 연결 성공");
            
                // 메시지 수신
                ttContainer.onMessage = function(message) {
                    console.log(`Message received :: ${message}`);
                };
            });

            // 메시지 전송 함수
            function sendControlMessage(remote) {
                // 메시지 전송
                ttContainer.sendMessage(remote);
            }

    </script>

    <style>
      /* Global */
      * {
        font-family: "Encode Sans Semi Expanded", sans-serif;
      }

      /* Layout */
      .tablet-optimized {
        min-height: 100vh;
        width: 100vw;
        max-width: 1200px;
        aspect-ratio: 3 / 5; /* 1200:2000 (portrait) */
      }

      .bg-main {
        background-image: url("./image/Background2.png");
        background-size: cover;
        background-position: 45% center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      .portrait-layout {
        padding-top: 10vh;
        padding-bottom: 15vh;
      }

      /* Typography (base: 600x1000) */
      .hi-furon {
        font-size: 18pt;
        font-weight: 100; /* ExtraLight */
      }

      .furon-flow {
        font-size: 43pt;
        font-weight: 500; /* Regular */
      }

      .button-text {
        font-size: 28pt;
        font-weight: 200; /* Light */
      }

      .explain-text {
        position: absolute;
        bottom: 10vh; /* 10% from bottom */
        left: 50%;
        transform: translateX(-50%);
        font-size: 18pt;
        font-weight: 100;
      }

      /* 통합된 버튼 스타일 */
      .btn-glass {
        /* 크기 */
        width: 300px;
        height: 65px;
        
        /* 폰트 */
        font-size: 26pt;
        font-weight: 100;
        
        /* 유리 효과 */
        background-color: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px) brightness(1.05);
        -webkit-backdrop-filter: blur(5px) brightness(1.05);
        
        /* 디자인 */
        color: white;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        
        /* 레이아웃 */
        display: flex;
        align-items: center;
        justify-content: center;
        
        /* 애니메이션 */
        transition: all 0.3s ease;
        
        /* 그림자 */
        box-shadow: 
          0 8px 32px rgba(0, 0, 0, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.4),
          inset 0 -1px 0 rgba(255, 255, 255, 0.1);
      }

      /* 호버 효과 */
      .btn-glass:hover {
        background-color: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px) saturate(130%) brightness(1.1) hue-rotate(5deg);
        -webkit-backdrop-filter: blur(20px) saturate(130%) brightness(1.1) hue-rotate(5deg);
        transform: scale(1.05);
        
        box-shadow:
          0 12px 40px rgba(0, 0, 0, 0.15),
          inset 0 2px 0 rgba(255, 255, 255, 0.5),
          inset 0 -2px 0 rgba(255, 255, 255, 0.2);
      }



      /* 반응형 (1200×2000) */
      @media (min-width: 1000px) {
        .btn-glass {
          width: 600px;
          height: 130px;
          font-size: 50pt;
          font-weight: 100;
        }

        .hi-furon {
          font-size: 36pt;
        }

        .furon-flow {
          font-size: 86pt;
        }

        .explain-text {
          bottom: 8vh;
          font-size: 36pt;
        }

        .button-container {
          gap: 3rem;
        }
      }

      /* 버튼 공통 스타일 - 진짜 유리 질감 */
      .btn-common {
        /* 매우 투명한 유리 배경 */
        background-color: rgba(255, 255, 255, 0.1);
        
        /* text-white */
        color: white;
        
        /* rounded-full */
        border-radius: 9999px;
        
        /* 은은한 유리 테두리 */
        border: 1px solid rgba(255, 255, 255, 0.2);
        
        /* transition-all duration-300 */
        transition: all 0.3s ease;
        
        /* flex items-center justify-center */
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* hover 시 유리 질감 강화 */
      .btn-common:hover {
        background-color: rgba(255, 255, 255, 0.15);
        transform: scale(1.05);
      }

    </style>
  </head>

  <body class="overflow-hidden">
    <!-- Main container (portrait tablet optimized) -->
    <div
      class="tablet-optimized bg-main flex flex-col items-center justify-center portrait-layout mx-auto"
    >
      <!-- Hi furon -->
      <div class="text-white hi-furon mb-0"> Welcome to this moment </div>

      <!-- Furon Flow -->
      <div class="text-white furon-flow mb-24 lg:mb-36 text-center leading-tight">
        How We Relate
      </div>

      <!-- 5 buttons (vertical) -->
      <div class="flex flex-col space-y-10 button-container">
        <button class="btn-glass btn-replaying" onclick="sendControlMessage('Replaying')" >
          Replaying
        </button>

        <button class="btn-glass" onclick="sendControlMessage('Listening')">
          Listening
        </button>

        <button class="btn-glass" onclick="sendControlMessage('Analyzing')">
          Analyzing
        </button>

        <button class="btn-glass" onclick="sendControlMessage('Answering')">
          Answering
        </button>

        <button class="btn-glass" onclick="sendControlMessage('Arriving')">
          Arriving
        </button>

      </div>

      <!-- Helper text -->
      <div class="text-white explain-text text-center">버튼을 눌러보세요</div>

    </div>

  </body>
</html>
